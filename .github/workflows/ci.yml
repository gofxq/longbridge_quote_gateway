name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - run: cd third_party/openapi-go && go test ./quote -run TestGatewayTurnoverNotOverwritten
      - run: CGO_ENABLED=0 go build ./cmd/server
      - run: docker build -t quote-gateway:test .
